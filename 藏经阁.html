    if(!items.length) return;
    if(!confirm('清空回收站？'+items.length+' 个词条将被永久删除，不可恢复。')) return;
    await trashEmpty();
    await refresh();
    renderTrash(); renderLog();
  };
  renderTrash();
  renderLog();

  const rc = app.querySelector('#btnReconnect');
  if(rc) rc.onclick = ()=>connect();
  app.querySelector('#btnExport').onclick = ()=>{
    const blob = new Blob([JSON.stringify({entries:state.entries},null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '藏经阁-备份-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  app.querySelector('#btnImport').onclick = ()=>app.querySelector('#fileIn').click();
  app.querySelector('#fileIn').onchange = async (ev)=>{
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!Array.isArray(d.entries)) throw 0;
        if(!confirm('将把备份里的 '+d.entries.length+' 个词条写成 .md 文件（同名文件会被覆盖）。继续？')) return;
        let ok = 0;
        for(const it of d.entries){
          if(!it || !it.name) continue;
          const type = TYPES[it.type] ? it.type : 'lore';
          try{
            await writeEntry({ name:safeName(it.name), type, aliases:(it.aliases||[]).filter(Boolean), year:it.year||'', fields:(it.fields||[]).filter(f=>f.label), content:it.content||'' });
            ok++;
          }catch(e){}
        }
        alert('已写入 '+ok+' 个词条文件');
        await refresh();
      }catch(e){ alert('文件格式不对，导入失败'); }
    };
    r.readAsText(f,'utf-8');
  };
  app.querySelector('#btnClear').onclick = async ()=>{
    if(!confirm('把全部 '+state.entries.length+' 个词条移入回收站？可在上方「回收站」逐个恢复。建议先导出备份。')) return;
    for(const e of state.entries){ await removeEntryFile(e.type, e.name); }
    ui.openId = null; ui.editing = undefined;
    await refresh();
  };
}

/* ============ 关系图 ============ */
let graphRAF = null;
function stopGraph(){ if(graphRAF){ cancelAnimationFrame(graphRAF); graphRAF = null; } }
let tlRAF = null;
function stopTimeline(){ if(tlRAF){ cancelAnimationFrame(tlRAF); tlRAF = null; } }

/* ============ 家族树 ============ */
let famCleanup = [];
function stopFamily(){
  famCleanup.forEach(fn=>{ try{ fn(); }catch(e){} });
  famCleanup = [];
}
function buildFamilyTree(){
  const people = state.entries.filter(e => e.type === 'role');
  const byName = {};
  for(const e of people){
    byName[e.name] = e;
    for(const a of namesOf(e)) byName[a] = e;
  }
  const parentOf = {}, childrenOf = {};
  for(const e of people){
    const f = (e.fields||[]).find(x => x.label === '父母');
    if(!f || !f.value) continue;
    for(const nm of String(f.value).split(/[,，、]/).map(s=>s.trim()).filter(Boolean)){
      const p = byName[nm];
      if(!p || p.id === e.id) continue;
      if((parentOf[e.id]||[]).indexOf(p.id) >= 0) continue;
      (parentOf[e.id] = parentOf[e.id]||[]).push(p.id);
      (childrenOf[p.id] = childrenOf[p.id]||[]).push(e.id);
    }
  }
  /* 配偶推断：共同孩子的父母互为配偶，用并查集把一家人归到一组 */
  const par = {};
  function find(x){ return par[x] = par[x] || x, par[x] === x ? x : (par[x] = find(par[x])); }
  function unite(a, b){ const ra = find(a), rb = find(b); if(ra !== rb) par[ra] = rb; }
  for(const cid in parentOf){
    const ps = parentOf[cid];
    for(let i=1;i<ps.length;i++) unite(ps[0], ps[i]);
  }
  const groups = {};
  for(const e of people){ const r = find(e.id); (groups[r] = groups[r] || []).push(e.id); }
  return {people, parentOf, childrenOf, groups};
}
/* 以「配偶组」为最小单元布局；组内横向排列（用配偶连线连起来），孩子挂在组下方 */
function layoutForest(groups, childrenOf){
  const NODE_W = 144, SPOUSE_GAP = 32, GAP_X = 24, LEVEL_H = 112;
  function unitOf(id){
    for(const k in groups){ if(groups[k].indexOf(id) >= 0) return groups[k].slice(); }
    return [id];
  }
  function unitKey(u){ return u.slice().sort().join('|'); }
  function unitWidth(u){ return u.length * NODE_W + (u.length - 1) * SPOUSE_GAP; }
  function unitChildren(u){
    const out = [], seen = {};
    for(const id of u){
      for(const k of (childrenOf[id]||[])){
        const ku = unitKey(unitOf(k));
        if(seen[ku]) continue;
        seen[ku] = 1;
        out.push(k);
      }
    }
    return out;
  }
  const wcache = {}, busy = {};
  function measureUnit(u){
    const k = unitKey(u);
    if(wcache[k]) return wcache[k];
    if(busy[k]) return unitWidth(u) + GAP_X;
    busy[k] = 1;
    let kidsW = 0;
    for(const c of unitChildren(u)) kidsW += measureUnit(unitOf(c));
    wcache[k] = Math.max(unitWidth(u) + GAP_X, kidsW);
    delete busy[k];
    return wcache[k];
  }
  const out = [], seenUnits = {}, spouseEdges = [], childEdges = [], unitKeyById = {};
  function placeUnit(u, depth, left){
    if(depth > 8) return;
    const k = unitKey(u);
    if(seenUnits[k]) return;
    seenUnits[k] = 1;
    const w = measureUnit(u);
    const uw = unitWidth(u);
    const x0 = left + (w - uw) / 2;
    for(let i=0;i<u.length;i++){
      const id = u[i];
      out.push({id:id, depth:depth,
                cx:x0 + i*(NODE_W+SPOUSE_GAP) + NODE_W/2,
                cy:36 + depth*LEVEL_H,
                dup:false});
      unitKeyById[id] = k;
      if(i > 0) spouseEdges.push({y:36 + depth*LEVEL_H, x1:x0 + (i-1)*(NODE_W+SPOUSE_GAP) + NODE_W, x2:x0 + i*(NODE_W+SPOUSE_GAP) - NODE_W/2});
    }
    let x = left;
    for(const c of unitChildren(u)){
      const cu = unitOf(c);
      childEdges.push({pkey:k, ckey:unitKey(cu)});
      placeUnit(cu, depth+1, x);
      x += measureUnit(cu);
    }
  }
  /* 根单元：成员都无父母的单元 */
  const hasParent = {};
  for(const id in childrenOf){ for(const k of childrenOf[id]) hasParent[k] = 1; }
  const rootList = [];
  const doneRoots = {};
  for(const k in groups){
    if(groups[k].some(id => hasParent[id])) continue;
    if(doneRoots[k]) continue;
    rootList.push(groups[k]);
    doneRoots[k] = 1;
  }
  if(!rootList.length && groups[Object.keys(groups)[0]]) rootList.push(groups[Object.keys(groups)[0]]);
  let left = 0;
  for(const r of rootList){ const w = measureUnit(r); placeUnit(r, 0, left); left += w + 44; }
  let maxD = 0;
  for(const n of out) if(n.depth > maxD) maxD = n.depth;
  return {nodes:out, spouseEdges:spouseEdges, childEdges:childEdges,
          unitKeyById:unitKeyById, width:Math.max(left - 44, 300), height:80 + maxD*LEVEL_H};
}
function shortInfo(e){
  const f = (e.fields||[]).find(x => x.value);
  return f ? String(f.value).slice(0,14) : (e.year || '');
}
function renderFamily(){
  stopFamily();
  const tree = buildFamilyTree();
  const roots = tree.people.filter(e => (tree.childrenOf[e.id]||[]).length && !(tree.parentOf[e.id]||[]).length).map(e=>e.id);
  const rootList = roots.length ? roots : tree.people.filter(e => (tree.childrenOf[e.id]||[]).length).map(e=>e.id);

  app.innerHTML = '<main class="tl-page">' +
    '<div class="page-hd"><h2>家族</h2><span class="sub">由人物词条的「父母」字段自动生成</span></div>' +
    '<div class="toolbar">' +
      '<div class="seg">' +
        '<button class="btn" id="famFit">全览</button>' +
        '<button class="btn icon" id="famMinus" title="缩小">−</button>' +
        '<button class="btn icon" id="famPlus" title="放大">＋</button>' +
      '</div>' +
      '<span class="hint">滚轮缩放 · 拖拽平移 · 点击节点打开词条</span>' +
      '<span class="spacer"></span>' +
      '<span class="hint">'+rootList.length+' 个家族 · '+Object.keys(tree.parentOf).length+' 条亲子关系</span>' +
    '</div>' +
    '<div id="famBox"><svg id="famSvg"></svg></div></main>';

  const box = app.querySelector('#famBox');
  if(!rootList.length){
    box.innerHTML = '<div class="empty"><h3>还没有家族关系</h3>' +
      '<p>给人物词条填上「父母」字段，值写已有人物的名字（多个用逗号分隔），家族树会自动画出来。<br>人物的默认模板里已经有这个字段。</p></div>';
    return;
  }
  const layout = layoutForest(tree.groups, tree.childrenOf);
  const svg = app.querySelector('#famSvg');
  const W = box.clientWidth || 900;
  const H = Math.max(420, Math.min(720, layout.height));
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  let html = '<g id="famG">';
  /* 配偶连线（横线） */
  for(const s of layout.spouseEdges){
    html += '<line class="fam-spouse" x1="'+s.x1.toFixed(1)+'" y1="'+s.y.toFixed(1)+'" x2="'+s.x2.toFixed(1)+'" y2="'+s.y.toFixed(1)+'"/>';
  }
  const nodesByKey = {};
  for(const n of layout.nodes){ (nodesByKey[layout.unitKeyById[n.id]] = nodesByKey[layout.unitKeyById[n.id]] || []).push(n); }
  /* 亲子连线：按单元去重后的边画 */
  for(const e of layout.childEdges){
    const pNodes = nodesByKey[e.pkey], cNodes = nodesByKey[e.ckey];
    if(!pNodes || !cNodes || !cNodes.length) continue;
    const px = pNodes.length > 1 ? (pNodes[0].cx + pNodes[pNodes.length-1].cx)/2 : pNodes[0].cx;
    const cx = cNodes.length > 1 ? (cNodes[0].cx + cNodes[cNodes.length-1].cx)/2 : cNodes[0].cx;
    const y1 = pNodes[0].cy + 22, y2 = cNodes[0].cy - 22, my = (y1 + y2) / 2;
    html += '<path class="fam-link" d="M'+px.toFixed(1)+' '+y1+' V'+my.toFixed(1)+' H'+cx.toFixed(1)+' V'+y2+'"/>';
  }
  for(const n of layout.nodes){
    const e = entryById(n.id);
    if(!e) continue;
    const tp = TYPES[e.type] || TYPES.lore;
    const nm = e.name.length > 7 ? e.name.slice(0,7) + '…' : e.name;
    html += '<g class="fam-node'+(n.dup?' dup':'')+'" data-id="'+esc(n.id)+'" transform="translate('+(n.cx-72)+','+(n.cy-26)+')">' +
      '<rect width="144" height="52" rx="12" fill="'+tp.fill+'" stroke="'+tp.color+'"'+(n.dup?' stroke-dasharray="4 3"':'')+'/>' +
      '<text class="fam-nm" x="72" y="22">'+esc(nm)+'</text>' +
      '<text class="fam-sub" x="72" y="39">'+esc(shortInfo(e))+'</text></g>';
  }
  html += '</g>';
  svg.innerHTML = html;

  const g = svg.querySelector('#famG');
  let k = 1, tx = 0, ty = 0;
  function apply(){ g.setAttribute('transform', 'translate('+tx.toFixed(1)+','+ty.toFixed(1)+') scale('+k.toFixed(3)+')'); }
  function fit(){
    k = Math.max(0.25, Math.min(1, Math.min(W / layout.width, H / layout.height) * 0.92));
    tx = (W - layout.width * k) / 2;
    ty = 8;
    apply();
  }
  function zoomAt(mx, my, f){
    const nk = Math.max(0.2, Math.min(3, k * f));
    tx = mx - (mx - tx) * (nk / k);
    ty = my - (my - ty) * (nk / k);
    k = nk;
    apply();
  }
  fit();
  app.querySelector('#famFit').onclick = fit;
  app.querySelector('#famMinus').onclick = ()=>zoomAt(W/2, H/2, 1/1.25);
  app.querySelector('#famPlus').onclick = ()=>zoomAt(W/2, H/2, 1.25);

  svg.addEventListener('wheel', ev=>{
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.15 : 1/1.15);
  }, {passive:false});

  let drag = false, lx = 0, ly = 0;
  svg.addEventListener('mousedown', ev=>{ drag = true; lx = ev.clientX; ly = ev.clientY; });
  const onMove = ev=>{
    if(!drag) return;
    tx += ev.clientX - lx; ty += ev.clientY - ly;
    lx = ev.clientX; ly = ev.clientY; apply();
  };
  const onUp = ()=>{ drag = false; };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  famCleanup.push(()=>{
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  });

  svg.querySelectorAll('.fam-node').forEach(nd=>{
    nd.onclick = ()=>{
      ui.tab = 'entries'; ui.openId = nd.dataset.id; ui.editing = undefined;
      render();
    };
  });
}

/* ============ 地图 ============ */
async function mapFiles(){
  if(SERVER_MODE){
    try{ const r = await fetch('/api/mapfiles'); return ((await r.json()).files) || []; }
    catch(e){ return []; }
  }
  const dh = await getDir('地图', false);
  if(!dh) return [];
  return (await fsaListFiles(dh)).filter(f=>/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(f)).sort();
}
async function mapsLoad(){
  if(SERVER_MODE){
    try{ const r = await fetch('/api/maps'); return ((await r.json()).maps) || []; }
    catch(e){ return []; }
  }
  const t = await fsaRead(state.root, '.maps.json');
  if(t === null) return [];
  try{ return JSON.parse(t).maps || []; }catch(e){ return []; }
}
async function mapsSave(list){
  if(SERVER_MODE){ await post('/api/maps', {maps:list}); return; }
  await fsaWrite(state.root, '.maps.json', JSON.stringify({maps:list}, null, 2));
}
async function mapImgUrl(file){
  if(SERVER_MODE) return '/api/file?p=' + encodeURIComponent('地图/' + file);
  const dh = await getDir('地图', false);
  if(!dh) return '';
  try{ return URL.createObjectURL(await (await dh.getFileHandle(file)).getFile()); }
  catch(e){ return ''; }
}
function shortEntryName(id){
  const e = entryById(id);
  return e ? e.name : String(id || '').split('/').pop();
}
/* 标记模式下选一个词条 */
function pickEntryForPin(){
  return new Promise(resolve=>{
    const list = state.entries.slice().sort((a,b)=>a.name.localeCompare(b.name, 'zh'));
    const mask = document.createElement('div');
    mask.className = 'mask';
    mask.innerHTML = '<div class="modal">' +
      '<div class="modal-hd"><h3>标记哪个词条</h3><span class="msub">点图上位置后选择</span>' +
      '<button class="modal-x" id="pX">×</button></div>' +
      '<div class="modal-bd">' +
      '<input type="text" id="pQ" class="pick-q" placeholder="搜索词条名…">' +
      '<div id="pList" class="pick-list"></div></div>' +
      '<div class="modal-ft"><span class="spacer"></span><button class="btn ghost" id="pCancel">取消</button></div></div>';
    document.body.appendChild(mask);
    function close(){ mask.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(ev){ if(ev.key === 'Escape'){ close(); resolve(null); } }
    document.addEventListener('keydown', onKey);
    function fill(){
      const q = mask.querySelector('#pQ').value.trim().toLowerCase();
      const arr = list.filter(e=>!q || namesOf(e).join(' ').toLowerCase().indexOf(q) >= 0);
      mask.querySelector('#pList').innerHTML = arr.length
        ? arr.map(e=>{
            const tp = TYPES[e.type] || TYPES.lore;
            return '<div class="pick-row" data-id="'+esc(e.id)+'">' +
              '<span class="dot" style="background:'+tp.color+'"></span>'+esc(e.name)+
              '<span class="pt">'+tp.label+'</span></div>';
          }).join('')
        : '<div class="era-empty">没有匹配的词条</div>';
      mask.querySelectorAll('.pick-row').forEach(r=>{
        r.onclick = ()=>{ close(); resolve(r.dataset.id); };
      });
    }
    mask.querySelector('#pQ').oninput = fill;
    mask.querySelector('#pX').onclick = ()=>{ close(); resolve(null); };
    mask.querySelector('#pCancel').onclick = ()=>{ close(); resolve(null); };
    mask.onclick = ev=>{ if(ev.target === mask){ close(); resolve(null); } };
    fill();
    mask.querySelector('#pQ').focus();
  });
}

function renderGraph(){
  app.innerHTML = '<main style="max-width:1100px;"><div id="graphBox"><canvas id="graph"></canvas></div>' +
    '<p class="ghint">圆点 = 词条（大小代表被关联次数），连线 = 相互提及。点圆点打开词条，可拖拽。颜色：' +
    Object.values(TYPES).map(t=>'<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+t.color+';margin:0 3px 0 10px;"></span>'+t.label).join('') +
    '</p></main>';
  const canvas = document.getElementById('graph');
  const W = 1000, H = 620;
  canvas.width = W; canvas.height = H;

  /* 节点太多时力导向是 O(n²)，这里按「被关联次数」取最相关的若干条 */
  const MAX_GRAPH_NODES = 400;
  const midx = mentionIndex();
  const degOf = {};
  for(const e of state.entries) degOf[e.id] = 0;
  for(const [id, list] of midx) degOf[id] = (degOf[id]||0) + list.length;
  let pool = state.entries;
  let truncated = 0;
  if(pool.length > MAX_GRAPH_NODES){
    pool = pool.slice().sort((a,b)=>(degOf[b.id]||0)-(degOf[a.id]||0)).slice(0, MAX_GRAPH_NODES);
    truncated = state.entries.length - pool.length;
  }
  const nodes = pool.map(e=>({e, x: W/2 + (Math.random()-0.5)*500, y: H/2 + (Math.random()-0.5)*300, vx:0, vy:0, deg:degOf[e.id]||0}));
  const byId = {}; nodes.forEach(n=>byId[n.e.id]=n);
  /* 建边：走倒排索引，不再对全文做 O(n²) 交叉扫描 */
  const edges = [];
  const seen = new Set();
  for(const n of nodes){
    for(const src of (midx.get(n.e.id) || [])){
      const m = byId[src.id];
      if(!m || m === n) continue;
      const key = [n.e.id, m.e.id].sort().join('|');
      if(seen.has(key)) continue;
      seen.add(key);
      edges.push([n, m]);
    }
  }

  const ctx = canvas.getContext('2d');
  let alpha = 1, frames = 0, settled = false;
  let dragNode = null, dragMoved = 0, lastMouse = null;
  /* 拖拽后重新激活模拟（收敛后 rAF 已停，这里负责重启） */
  function wake(){
    alpha = Math.max(alpha, 0.28);
    settled = false;
    if(!graphRAF) graphRAF = requestAnimationFrame(loop);
  }

  function step(){
    for(let i=0;i<nodes.length;i++){
      const a = nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b = nodes[j];
        let dx = a.x-b.x, dy = a.y-b.y;
        let d2 = dx*dx+dy*dy; if(d2<1) d2=1;
        const f = 2600/d2 * alpha;
        const d = Math.sqrt(d2);
        const fx = dx/d*f, fy = dy/d*f;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      }
    }
    for(const [a,b] of edges){
      let dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.sqrt(dx*dx+dy*dy)||1;
      const f = (d-110)*0.012*alpha;
      const fx = dx/d*f, fy = dy/d*f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for(const n of nodes){
      n.vx += (W/2-n.x)*0.002*alpha; n.vy += (H/2-n.y)*0.002*alpha;
      if(n!==dragNode){ n.x += n.vx; n.y += n.vy; }
      n.vx *= 0.85; n.vy *= 0.85;
      n.x = Math.max(40, Math.min(W-40, n.x));
      n.y = Math.max(40, Math.min(H-40, n.y));
    }
    /* 收敛后彻底停下力学计算（O(n²)），只保留绘制，避免长时间空转 */
    alpha *= 0.985; frames++;
    if(alpha < 0.02) settled = true;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1;
    for(const [a,b] of edges){
      ctx.strokeStyle = 'rgba(83,74,183,0.18)';
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    for(const n of nodes){
      const tp = TYPES[n.e.type]||TYPES.lore;
      const r = 11 + Math.min(n.deg,8)*1.8;
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      ctx.fillStyle = tp.fill; ctx.fill();
      ctx.strokeStyle = tp.color; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = '#2c2c2a';
      ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(n.e.name.length>10?n.e.name.slice(0,10)+'…':n.e.name, n.x, n.y + r + 14);
    }
  }

  function loop(){
    /* 收敛后彻底停止：不计算、不重绘、也不再占用 requestAnimationFrame，等 wake() 唤醒 */
    if(alpha > 0.02 || dragNode){
      step(); draw(); settled = false;
      graphRAF = requestAnimationFrame(loop);
    }else if(!settled){
      draw(); settled = true;
      graphRAF = requestAnimationFrame(loop);
    }else{
      graphRAF = null;
    }
  }
  if(truncated > 0){
    const hint = app.querySelector('.ghint');
    if(hint) hint.insertAdjacentHTML('afterend',
      '<p class="ghint" style="color:#a3540b;">词条较多，这里只画出关联最紧密的 '+
      MAX_GRAPH_NODES+' 个（另有 '+truncated+' 个未显示）。</p>');
  }
  loop();

  function nodeAt(x,y){
    for(const n of nodes){
      const r = 11 + Math.min(n.deg,8)*1.8 + 4;
      if((n.x-x)**2 + (n.y-y)**2 < r*r) return n;
    }
    return null;
  }
  canvas.addEventListener('mousedown', ev=>{
    const p = toLocal(ev); dragNode = nodeAt(p.x,p.y); dragMoved = 0; lastMouse = p;
    if(dragNode) wake();
    if(dragNode) canvas.style.cursor='grabbing';
  });
  canvas.addEventListener('mousemove', ev=>{
    const p = toLocal(ev);
    if(dragNode){
      dragMoved += Math.abs(p.x-lastMouse.x)+Math.abs(p.y-lastMouse.y);
      dragNode.x = p.x; dragNode.y = p.y; dragNode.vx = 0; dragNode.vy = 0;
      lastMouse = p;
    } else {
      canvas.style.cursor = nodeAt(p.x,p.y) ? 'pointer' : 'grab';
    }
  });
  canvas.addEventListener('mouseup', ev=>{
    if(dragNode && dragMoved < 5){
      ui.tab='entries'; ui.openId = dragNode.e.id; ui.editing = undefined;
      stopGraph(); render(); return;
    }
    dragNode = null; canvas.style.cursor='grab';
  });
  function toLocal(ev){
    const r = canvas.getBoundingClientRect();
    return {x:(ev.clientX-r.left)*W/r.width, y:(ev.clientY-r.top)*H/r.height};
  }
}

/* ============ 全局事件 ============ */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ ui.tab = b.dataset.tab; ui.editing = undefined; render(); });
document.addEventListener('click', ev=>{
  const a = ev.target.closest('.lk');
  if(a && a.dataset.id){
    ev.preventDefault();
    ui.tab='entries'; ui.openId = a.dataset.id; ui.editing = undefined;
    render();
    const box = document.querySelector('.item[data-id="'+CSS.escape(a.dataset.id)+'"]');
    if(box) box.scrollIntoView({block:'nearest'});
  }
});

/* 支持 #timeline / #graph / #family / #maps / #data 直接跳转到对应页 */
(function(){
  const h = (location.hash || '').replace(/^#/, '');
  if(TAB_IDS[h]) ui.tab = h;
})();

if(SERVER_MODE){
  /* 服务模式：本地服务直读直写，免授权。心跳保活，页面关闭约 3 分钟后服务自动退出 */
  fetch('/api/ping').catch(()=>{});
  setInterval(()=>{ fetch('/api/ping').catch(()=>{}); }, 5000);
  refresh();
}else{
  render();
}
</script>
